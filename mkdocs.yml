site_name: Game Research
site_description: Research notes on adventure and visual novel games, their engines, and their formats.
site_url: https://monyarm.github.io/game-research/
repo_url: https://github.com/monyarm/game-research
repo_name: monyarm/game-research
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Engines:
      - "Scooby-Doo! Case File #3: Flash runtime": engines/scooby-doo-case-file-3-flash.md
      - "Soalo (Zero no Tsukaima PS2 engine)":
          - Overview: engines/zero-no-tsukaima-soalo.md
          - Executable findings: engines/zero-no-tsukaima-soalo/executable.md
          - Payload layout: engines/zero-no-tsukaima-soalo/payload.md
          - Archives: engines/zero-no-tsukaima-soalo/archives.md
          - Scripts: engines/zero-no-tsukaima-soalo/scripts.md
          - Textures: engines/zero-no-tsukaima-soalo/textures.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

copyright: >
  Copyright &copy; 2026 Simeon Armenchev (monyarm).
  Game titles and trademarks belong to their respective owners.
